<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Panel C&E</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>

    <!-- VISTA LOGIN -->
    <div id="vista-login">
        <div class="login-caja">
            <h1>Panel C&E Urban Wear</h1>
            <input type="email" id="login-email" placeholder="Correo">
            <input type="password" id="login-pass" placeholder="Contraseña">
            <button id="btn-entrar">Entrar</button>
            <p id="login-error"></p>
        </div>
    </div>

    <!-- VISTA PANEL -->
    <div id="vista-panel" class="oculto">
        <header>
            <h1 id="titulo-seccion">📦 Pedidos</h1>
            <nav style="display:flex; gap:8px;">
                <button class="tab-btn activo" data-tab="pedidos">Pedidos</button>
                <button class="tab-btn" data-tab="inventario">Inventario</button>
                <button id="btn-salir">Salir</button>
            </nav>
        </header>
        <main>
            <div class="filtros" id="filtros">
                <button data-estado="pendiente" class="activo">Pendientes</button>
                <button data-estado="confirmado">Confirmados</button>
                <button data-estado="enviado">Enviados</button>
                <button data-estado="entregado">Entregados</button>
                <button data-estado="todos">Todos</button>
            </div>
            <div id="lista-pedidos"></div>
            <div id="resumen-stats" style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px;"></div>
            <div id="vista-inventario" class="oculto">
                <div id="lista-inventario"></div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/panel.js"></script>
</body>
</html>
