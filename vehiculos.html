<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzos | C&E Urban</title>
    <link rel="icon" href="IMAGENES/favicon.png">
    <link rel="stylesheet" href="CSS/index.css">
    <link rel="stylesheet" href="CSS/ux-improvements.css">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">
            <img src="IMAGENES/favicon.png" alt="Logo">
            <h1>C&E URBAN</h1>
        </a>

        <nav class="navbar">
            <a href="index.html">Inicio</a>
            <div class="dropdown">
                <button class="dropbtn">Productos</button>
                <div class="dropdown-content">
                    <a href="productos.html">Todos</a>
                    <a href="ropa.html">Jeans</a>
                    <a href="accesorios.html">Sudaderas</a>
                    <a href="vehiculos.html">Buzos</a>
                    <a href="tecnologia.html">Gorras</a>
                </div>
            </div>
            <a href="index.html#collections">Colecciones</a>
            <a href="index.html#nosotros">Nosotros</a>
            <a href="contacto.html">Contacto</a>
            
            <a href="admin.html" class="admin-link hidden">Dashboard</a>
        </nav>

        <div class="menu-toggle">☰</div>

        <div class="icons">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Buscar productos...">
                <span class="search-icon">🔍</span>
            </div>
            <a href="login.html" class="user-icon" title="Iniciar sesión">👤</a>
            <div class="cart-icon">🛒<span id="cart-count">0</span></div>
        </div>
    </header>

    <!-- ========================= -->
    <!-- PANEL CARRITO -->
    <!-- ========================= -->
    <div class="cart-panel">
        <!-- HEADER -->
        <div class="cart-header">
            <h2>Buzos urbanos</h2>
            <div class="cart-header-actions">
                <button class="clear-cart" title="Vaciar carrito">🗑️</button>
                <span class="close-cart">✖</span>
            </div>
        </div>

        <!-- PRODUCTOS -->
        <div class="cart-items">
            <p class="empty-cart">Tu carrito está vacío</p>
        </div>

        <!-- FOOTER -->
        <div class="cart-footer">
            <h3>Total: <span id="cart-total">$0</span></h3>
            <a href="pago.html">
                <button class="checkout-btn">Finalizar Compra</button>
            </a>
        </div>
    </div>

    <!-- ========================= -->
    <!-- HERO -->
    <!-- ========================= -->
    <section class="hero product-hero">
        <div class="hero-text">
            <p class="subtitulo">CATEGORÍA BUZOS</p>
            <h2>Buzos urbanos</h2>
            <p class="descripcion">Sudaderas y buzos cómodos para tu estilo.</p>
        </div>
        <div class="hero-img">
            <img src="IMAGENES/favicon.png" alt="Buzos">
        </div>
    </section>

    <section class="productos">
        <div class="productos-header">
            <h2>Buzos destacados</h2>
            <a href="productos.html">Ver todos</a>
        </div>
        <div class="productos-grid" id="productos-container" data-category="buzos"></div>
    </section>

    <script src="jvs/advanced-features.js"></script>
    <script src="jvs/ux-enhancements.js"></script>
    <script src="jvs/category.js"></script>
    <script src="jvs/carrito.js"></script>
    <script src="jvs/user-state.js"></script>
</body>
</html>
